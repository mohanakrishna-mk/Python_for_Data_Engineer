services:

  # ============================================================
  # POSTGRESQL
  # ============================================================
  postgres:
    image: postgres:13
    container_name: postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # ============================================================
  # ZOOKEEPER
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    hostname: zookeeper

    ports:
      - "2181:2181"

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    volumes:
      - ./data/zookeeper/data:/var/lib/zookeeper/data
      - ./data/zookeeper/log:/var/lib/zookeeper/log

    restart: unless-stopped


  # ============================================================
  # KAFKA
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    hostname: kafka

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:

      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: >-
        PLAINTEXT://0.0.0.0:9092,
        PLAINTEXT_HOST://0.0.0.0:29092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:9092,
        PLAINTEXT_HOST://localhost:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - ./data/kafka:/var/lib/kafka/data

    restart: unless-stopped


  # ============================================================
  # MINIO
  # S3-COMPATIBLE OBJECT STORAGE
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    volumes:
      - ./data/minio:/data

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ============================================================
  # SPARK MASTER
  # ============================================================
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    hostname: spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    ports:
      - "8080:8080"
      - "7077:7077"

    volumes:
      - ./src/spark/jobs:/opt/spark/jobs
      - ./data/spark:/opt/spark/data

    restart: unless-stopped


  # ============================================================
  # SPARK WORKER
  # ============================================================
  spark-worker:
    image: apache/spark:3.5.3
    container_name: spark-worker
    hostname: spark-worker

    depends_on:
      - spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2

    ports:
      - "8082:8081"

    volumes:
      - ./src/spark/jobs:/opt/spark/jobs
      - ./data/spark:/opt/spark/data

    restart: unless-stopped


  # ============================================================
  # AIRFLOW WEBSERVER
  # ============================================================
  airflow-webserver:
    image: apache/airflow:2.8.1
    container_name: airflow-webserver

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__FERNET_KEY: ""

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10

      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

      _PIP_ADDITIONAL_REQUIREMENTS: >-
        confluent-kafka
        yfinance
        pandas
        boto3
        snowflake-connector-python
        minio

    volumes:

      # Airflow DAGs
      - ./src/airflow/dags:/opt/airflow/dags

      # Airflow logs
      - ./src/airflow/logs:/opt/airflow/logs

      # Airflow plugins
      - ./src/airflow/plugins:/opt/airflow/plugins

      # Requirements
      - ./src/airflow/requirements:/opt/airflow/requirements

      # Reports
      - ./src/airflow/reports:/opt/airflow/reports

      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock

      # Spark jobs
      - ./src/spark/jobs:/opt/spark/jobs

      # Shared data
      - ./data:/opt/data

    command: webserver

    ports:
      - "8081:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/health"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

    restart: unless-stopped


  # ============================================================
  # AIRFLOW SCHEDULER
  # ============================================================
  airflow-scheduler:
    image: apache/airflow:2.8.1
    container_name: airflow-scheduler

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__FERNET_KEY: ""

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10

      _PIP_ADDITIONAL_REQUIREMENTS: >-
        confluent-kafka
        yfinance
        pandas
        boto3
        snowflake-connector-python
        minio

    volumes:

      - ./src/airflow/dags:/opt/airflow/dags

      - ./src/airflow/logs:/opt/airflow/logs

      - ./src/airflow/plugins:/opt/airflow/plugins

      - ./src/airflow/requirements:/opt/airflow/requirements

      - ./src/airflow/reports:/opt/airflow/reports

      - /var/run/docker.sock:/var/run/docker.sock

      - ./src/spark/jobs:/opt/spark/jobs

      - ./data:/opt/data

    command: scheduler

    restart: unless-stopped


  # ============================================================
  # AIRFLOW INITIALIZATION
  # ============================================================
  airflow-init:
    image: apache/airflow:2.8.1
    container_name: airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__FERNET_KEY: ""

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      _PIP_ADDITIONAL_REQUIREMENTS: >-
        confluent-kafka
        yfinance
        pandas
        boto3
        snowflake-connector-python
        minio

      _AIRFLOW_DB_UPGRADE: "true"

      _AIRFLOW_WWW_USER_CREATE: "true"

      _AIRFLOW_WWW_USER_USERNAME: airflow

      _AIRFLOW_WWW_USER_PASSWORD: airflow

    volumes:

      - ./src/airflow/dags:/opt/airflow/dags

      - ./src/airflow/logs:/opt/airflow/logs

      - ./src/airflow/plugins:/opt/airflow/plugins

      - ./src/airflow/requirements:/opt/airflow/requirements

      - ./src/airflow/reports:/opt/airflow/reports

    command: version


# ==============================================================
# VOLUMES
# ==============================================================
volumes:

  postgres-db-volume: